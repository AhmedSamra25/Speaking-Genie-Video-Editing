<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:#f6f7fb;font-family:var(--font-body);color:var(--ink)}.sw{border-radius:10px;border:1px solid rgba(15,23,42,0.06)}.n{font-size:11px;font-weight:600;color:var(--slate-700);margin-top:7px}.h{font-size:10px;color:var(--slate-400);font-family:ui-monospace,monospace}.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div data-theme="gradient" style="background:var(--page);border-radius:16px;padding:18px">
<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px"><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--page);border:1px solid var(--border)"></span><code style="font-size:11px;color:var(--ink-muted)">--page</code></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--surface);border:1px solid var(--border)"></span><code style="font-size:11px;color:var(--ink-muted)">--surface</code></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--card);border:1px solid var(--border)"></span><code style="font-size:11px;color:var(--ink-muted)">--card</code></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--ink);border:1px solid var(--border)"></span><code style="font-size:11px;color:var(--ink-muted)">--ink</code></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--ink-muted);border:1px solid var(--border)"></span><code style="font-size:11px;color:var(--ink-muted)">--ink-muted</code></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--ink-subtle);border:1px solid var(--border)"></span><code style="font-size:11px;color:var(--ink-muted)">--ink-subtle</code></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--border);border:1px solid var(--border)"></span><code style="font-size:11px;color:var(--ink-muted)">--border</code></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--hairline);border:1px solid var(--border)"></span><code style="font-size:11px;color:var(--ink-muted)">--hairline</code></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--accent);border:1px solid var(--border)"></span><code style="font-size:11px;color:var(--ink-muted)">--accent</code></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--accent-soft);border:1px solid var(--border)"></span><code style="font-size:11px;color:var(--ink-muted)">--accent-soft</code></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--chip-bg);border:1px solid var(--border)"></span><code style="font-size:11px;color:var(--ink-muted)">--chip-bg</code></div><div style="display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:var(--ghost-border);border:1px solid var(--border)"></span><code style="font-size:11px;color:var(--ink-muted)">--ghost-border</code></div>
</div></div></body></html>
