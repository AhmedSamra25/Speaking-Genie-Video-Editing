<!-- @dsCard group="Colors" viewport="700x214" name="Two accents, two audiences" subtitle="Green for individuals, orange for business. Never both on one surface" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--ink)}
.ar{font-family:var(--font-arabic);direction:rtl;text-align:right}
.n{font-size:11px;font-weight:600;color:var(--slate-700);margin-top:7px}
.h{font-size:10px;color:var(--slate-400);font-family:ui-monospace,monospace}
.lab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--slate-400)}
.ok{color:var(--green-600);font-weight:700}.no{color:var(--rose-deep);font-weight:700}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.sw{border-radius:10px;border:1px solid rgba(15,23,42,.06)}
</style></head><body><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px">
  <div style="background:var(--ground-dome);border-radius:14px;padding:18px">
    <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(201,166,232,.9)">Individual · TikTok, Instagram, Facebook</div>
    <div class="ar" style="font-size:26px;font-weight:700;color:#fff;margin-top:10px;line-height:1.4">ماتضيعش <span style="color:#10c185">وقتك</span></div>
    <div style="display:flex;gap:8px;margin-top:14px"><span style="flex:1"><span style="display:block;height:30px;border-radius:8px;background:#10c185"></span><span style="display:block;font-size:9px;color:rgba(255,255,255,.7);margin-top:5px;font-family:ui-monospace,monospace">#10c185</span></span><span style="flex:1"><span style="display:block;height:30px;border-radius:8px;background:#06bc78"></span><span style="display:block;font-size:9px;color:rgba(255,255,255,.7);margin-top:5px;font-family:ui-monospace,monospace">#06bc78</span></span><span style="flex:1"><span style="display:block;height:30px;border-radius:8px;background:#0a8f63"></span><span style="display:block;font-size:9px;color:rgba(255,255,255,.7);margin-top:5px;font-family:ui-monospace,monospace">#0a8f63</span></span></div>
  </div>
  <div style="background:var(--ground-night);border-radius:14px;padding:18px">
    <div style="font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(247,197,138,.9)">Business · LinkedIn, website</div>
    <div class="ar" style="font-size:26px;font-weight:700;color:#fff;margin-top:10px;line-height:1.4">لكن مش <span style="color:#e5831a">كل الموظفين</span></div>
    <div style="display:flex;gap:8px;margin-top:14px"><span style="flex:1"><span style="display:block;height:30px;border-radius:8px;background:#ff8e31"></span><span style="display:block;font-size:9px;color:rgba(255,255,255,.7);margin-top:5px;font-family:ui-monospace,monospace">#ff8e31</span></span><span style="flex:1"><span style="display:block;height:30px;border-radius:8px;background:#e5831a"></span><span style="display:block;font-size:9px;color:rgba(255,255,255,.7);margin-top:5px;font-family:ui-monospace,monospace">#e5831a</span></span><span style="flex:1"><span style="display:block;height:30px;border-radius:8px;background:#c26a0c"></span><span style="display:block;font-size:9px;color:rgba(255,255,255,.7);margin-top:5px;font-family:ui-monospace,monospace">#c26a0c</span></span></div>
  </div></div></body></html>
