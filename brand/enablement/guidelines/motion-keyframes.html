<!-- @dsCard group="Motion" viewport="700x126" name="Named keyframes" subtitle="egGlow, egRise, egFill, egSweep — live, running at real speed" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--ink)}.sw{border-radius:10px;border:1px solid rgba(15,23,42,0.06)}.n{font-size:11px;font-weight:600;color:var(--slate-700);margin-top:7px}.h{font-size:10px;color:var(--slate-400);font-family:ui-monospace,monospace}.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.row{display:flex;gap:10px;align-items:flex-end}</style>
</head><body><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:center">
  <div style="text-align:center"><span style="position:relative;display:inline-flex;width:56px;height:56px;align-items:center;justify-content:center"><span style="position:absolute;width:100%;height:100%;border-radius:999px;background:rgba(124,58,237,.28);animation:egGlow 2.4s ease-in-out infinite"></span><span style="width:34px;height:34px;border-radius:999px;background:var(--violet-600)"></span></span><div class="h" style="margin-top:8px">egGlow</div></div>
  <div style="text-align:center"><div style="font-family:var(--font-display);font-size:16px;font-weight:700;animation:egRise .24s cubic-bezier(0.22,1,0.36,1) both">Headline</div><div class="h" style="margin-top:8px">egRise</div></div>
  <div><div style="height:10px;border-radius:999px;background:var(--violet-100);overflow:hidden"><span style="display:block;height:100%;border-radius:999px;background:var(--violet-600);animation:egFill .9s cubic-bezier(0.22,1,0.36,1) both"></span></div><div class="h" style="margin-top:8px;text-align:center">egFill</div></div>
  <div><div style="position:relative;height:10px;border-radius:999px;background:var(--violet-100);overflow:hidden"><span style="position:absolute;inset:0 auto 0 0;width:40%;height:100%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95),rgba(255,255,255,0));animation:egSweep 1.6s linear infinite"></span></div><div class="h" style="margin-top:8px;text-align:center">egSweep</div></div>
  </div></body></html>
