<!-- @dsCard group="Brand" viewport="700x350" name="Capsule device" subtitle="Hairline white outline over a 10% fill. One per post" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--ink)}
.ar{font-family:var(--font-arabic);direction:rtl;text-align:right}
.n{font-size:11px;font-weight:600;color:var(--slate-700);margin-top:7px}
.h{font-size:10px;color:var(--slate-400);font-family:ui-monospace,monospace}
.lab{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--slate-400)}
.ok{color:var(--green-600);font-weight:700}.no{color:var(--rose-deep);font-weight:700}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.sw{border-radius:10px;border:1px solid rgba(15,23,42,.06)}
</style></head><body><div style="background:var(--ground-dome);border-radius:14px;padding:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center">
  <span style="display:inline-flex;align-items:center;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);backdrop-filter:blur(4px);border-radius:999px;padding:12px 26px;font-family:var(--font-arabic);font-weight:700;font-size:20px;color:#fff;direction:rtl">بص تحت على الشمال</span><span style="display:inline-flex;align-items:center;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);backdrop-filter:blur(4px);border-radius:999px;padding:16px 34px;font-family:var(--font-arabic);font-weight:700;font-size:25px;color:#e5831a;direction:rtl">بتعرف تتكلم اللغات دي</span><span style="display:inline-flex;align-items:center;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);backdrop-filter:blur(4px);border-radius:999px;padding:16px 34px;font-family:var(--font-arabic);font-weight:700;font-size:25px;color:#10c185;direction:rtl">Speak to Hire</span><span style="display:inline-flex;align-items:center;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);backdrop-filter:blur(4px);border-radius:999px;padding:12px 26px;font-family:var(--font-arabic);font-weight:700;font-size:20px;color:#e5831a;direction:rtl">وهيقــدروا:</span>
  </div>
  <div style="font-size:11px;line-height:1.6;color:var(--slate-500);margin-top:11px">The outline is white at 55% regardless of the ink. Ink is white when the capsule is an instruction, and the track accent when the capsule is the punchline.</div></body></html>
